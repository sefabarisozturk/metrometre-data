<style>
/* Bülten arşivi: yeni sayı en üstte. Yeni sayı eklerken <ol> başına bir <li> ekleyin. */
:root{
  --bg:#F0F0F0; --surface:#FFFFFF; --border:#E4E4E4;
  --text:#111111; --muted:#5F5F5F; --accent:#B4271F;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121212; --surface:#1C1C1C; --border:#2E2E2E;
  --text:#EDEDED; --muted:#A8A8A8; --accent:#E2665C; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;padding:28px 16px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.masthead{display:flex;flex-direction:column;gap:12px;border-bottom:2px solid var(--text);padding-bottom:18px}
.wordmark{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--text);text-decoration:none}
.wordmark span{color:var(--accent)}
.crumbs{font-size:13px;font-weight:600}
.crumbs a{text-decoration:none}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:800}
.lede{color:var(--muted);margin:0;max-width:62ch}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.issues a{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;text-decoration:none;color:var(--text)}
.issues a:hover{border-color:var(--accent)}
.issue-date{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.issue-title{font-size:17px;font-weight:700;line-height:1.35}
.foot{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a class="wordmark" href="/">metro<span>metre</span></a>
    <div class="crumbs"><a href="/">← Haritaya dön</a></div>
    <h1>Bültenler</h1>
    <p class="lede">İstanbul ve çevresinde yapımı süren raylı sistem hatlarında her ay öne çıkan gelişmeler.</p>
  </header>

  <ol class="issues">
    <li><a href="/bulten/2026-09">
      <span class="issue-date">Eylül 2026</span>
      <span class="issue-title">M12 son düzlüğe girdi, güney aksında takvim kaydı</span>
    </a></li>
  </ol>

  <p class="foot">Yeni bültenler için <a href="/feed.xml">RSS beslemesi</a>.</p>
</div>
</body>
</html>
