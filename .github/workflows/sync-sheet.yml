name: Sheet overlay senkronu

on:
  schedule:
    - cron: '17 */3 * * *'   # her 3 saatte bir (UTC)
  workflow_dispatch:          # elle tetikleme

permissions:
  contents: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sheet'i indir
        env:
          SHEET_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQWAERSk5JmraMKUiq68pMK_WSQ9sooPpD3bHjpxXdd0ibU5KDdtwun4iUCgZOSnzmIfwej0KAXm3uf/pub?output=csv
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
               -o overlay.new.csv "$SHEET_URL"
          # BOM ve CRLF temizliği — istemcideki başlık eşleştirmesini bozmasın
          sed -i '1s/^\xEF\xBB\xBF//' overlay.new.csv
          sed -i 's/\r$//' overlay.new.csv

      - name: Doğrula
        run: |
          set -euo pipefail

          # Yayın iptal edilmişse Google, CSV yerine HTML giriş sayfası döndürür
          if head -c 1 overlay.new.csv | grep -q '<'; then
            echo "::error::CSV yerine HTML geldi — sheet yayınını kontrol et."
            exit 1
          fi

          new=$(wc -l < overlay.new.csv)
          if [ "$new" -lt 2 ]; then
            echo "::error::Başlık dışında satır yok (satır sayısı: $new)."
            exit 1
          fi

          # Ani daralma koruması: mevcut dosyanın %70'inin altına düşerse commit'leme
          if [ -f overlay.csv ]; then
            old=$(wc -l < overlay.csv)
            if [ "$old" -gt 0 ] && [ $(( new * 100 / old )) -lt 70 ]; then
              echo "::error::Satır sayısı $old → $new düştü; şüpheli, commit edilmedi."
              exit 1
            fi
          fi

          echo "Doğrulama tamam — $new satır."

      - name: Değiştiyse commit'le
        run: |
          set -euo pipefail
          mv overlay.new.csv overlay.csv

          if [ -z "$(git status --porcelain -- overlay.csv)" ]; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlay.csv
          git commit -m "veri: sheet overlay senkronu ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
