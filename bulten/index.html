<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* metrometre (index.html) ile aynı jetonlar */
:root {
  --bg:#F0F0F0; --surface:#FFFFFF; --surface-2:#F7F7F7;
  --border:#E4E4E4; --border-2:#D1D1D1;
  --text:#111111; --text-muted:#6B6B6B; --text-dim:#757575;
  --accent:#B4271F; --header-h:52px;
  --font:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
html { -webkit-text-size-adjust:100%; }
body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:13px; line-height:1.5; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
:focus:not(:focus-visible) { outline:none; }

/* ── Üst başlık: sitedekiyle aynı ── */
#header {
  position:fixed; top:0; left:0; right:0; height:var(--header-h);
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; z-index:1000;
}
#logo-link { display:flex; align-items:center; gap:12px; text-decoration:none; height:36px; }
#logo-link:hover { text-decoration:none; }
#logo-img { height:26px; width:auto; display:block; flex-shrink:0; }
#logo-fallback { display:none; font-size:17px; font-weight:700; color:var(--text); letter-spacing:-0.03em; }
#logo-fallback span { font-weight:400; color:var(--text-muted); }
#logo-tagline {
  font-size:10px; font-weight:500; color:var(--text-dim); letter-spacing:.02em; line-height:1.35;
  padding-left:12px; border-left:1px solid var(--border);
}
#header-actions { display:flex; align-items:center; gap:10px; }
.hdr-btn {
  display:flex; align-items:center; gap:7px; height:32px; padding:0 13px 0 11px;
  border:1px solid var(--border-2); border-radius:99px; background:transparent; color:var(--text);
  font-family:var(--font); font-size:12px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap;
  transition:border-color .15s, color .15s, background .15s, box-shadow .15s; flex-shrink:0;
}
.hdr-btn:hover { border-color:var(--accent); color:var(--accent); background:#FEF2F2; text-decoration:none; }
.hdr-btn.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
.hdr-btn.primary:hover { background:#9C1F18; color:#fff; box-shadow:0 2px 8px rgba(180,39,31,.28); }
.hdr-btn svg { width:15px; height:15px; flex-shrink:0; }

/* ── Sayfa ── */
main { max-width:760px; margin:0 auto; padding:calc(var(--header-h) + 20px) 16px 40px; display:flex; flex-direction:column; gap:20px; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.sec-lbl { font-size:10px; font-weight:700; color:var(--text-dim); letter-spacing:.05em; text-transform:uppercase; margin:0 2px 8px; }
.prose { font-size:13.5px; line-height:1.65; color:var(--text-muted); }

/* Sayı başlığı */
.intro { padding:18px 20px 16px; display:flex; flex-direction:column; gap:8px; }
.eyebrow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tag { font-size:10px; font-weight:600; padding:1px 6px; border-radius:4px; white-space:nowrap; }
.tag-accent { background:#FEF2F2; color:var(--accent); }
h1 { font-size:20px; font-weight:700; line-height:1.3; letter-spacing:-0.02em; text-wrap:balance; }
/* Sitedeki metrik şeridi */
.metrics { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--border); }
.metric { padding:10px 10px 9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:60px; text-align:center; }
.metric:not(:last-child) { border-right:1px solid var(--border); }
.metric-val { font-size:15px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
.metric-lbl { font-size:9px; font-weight:600; color:var(--text-dim); letter-spacing:.04em; text-transform:uppercase; line-height:1.3; }

/* Yuvarlak hat ikonu (sitedeki .card-icon) */
.line-icon {
  width:var(--s); height:var(--s); border-radius:50%; overflow:hidden; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:#F0F0F0; border:1.5px solid var(--border);
}
.line-icon img { width:100%; height:100%; object-fit:cover; display:block; }
.icon-fb { width:100%; height:100%; display:flex; align-items:center; justify-content:center; border-radius:50%;
  font-size:11px; font-weight:700; color:#fff; letter-spacing:-0.04em; }
.icon-fb[hidden] { display:none; }


/* ── Kanca: başlık + geri sayım ── */
.hero { display:grid; grid-template-columns:minmax(0,1fr) 220px; }
.hero-main { padding:22px 22px 20px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.hero h1 { font-size:26px; line-height:1.18; letter-spacing:-0.03em; }
.dek { font-size:14px; line-height:1.6; color:var(--text-muted); max-width:60ch; }
.countdown { border-left:1px solid var(--border); background:var(--surface-2); padding:18px 18px 16px;
  display:flex; flex-direction:column; justify-content:space-between; gap:10px; color:var(--text); transition:background .15s; }
.countdown:hover { background:#FEF2F2; text-decoration:none; }
.cd-head { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; line-height:1.25; }
.cd-num { display:flex; align-items:baseline; gap:6px; }
.cd-num b { font-size:64px; line-height:.9; font-weight:700; letter-spacing:-0.05em; color:var(--accent); font-variant-numeric:tabular-nums; }
.cd-num span { font-size:15px; font-weight:600; color:var(--text-muted); }
.cd-foot { font-size:11.5px; color:var(--text-muted); line-height:1.4; }
.cd-foot strong { color:var(--text); }
.countdown.done .cd-num { display:none; }

/* ── Bir bakışta ── */
.glances { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.glance { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 14px 14px; display:flex; flex-direction:column; gap:7px; min-width:0; }
.g-head { display:flex; align-items:center; gap:8px; }
.g-head h2 { font-size:13px; font-weight:700; flex:1; min-width:0; }
.g-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.g-icons { display:flex; }
.g-icons .line-icon + .line-icon { margin-left:-6px; }
.g-go   .g-dot { background:#059669; }
.g-late .g-dot { background:var(--accent); }
.g-step .g-dot { background:#2563EB; }
.g-stop .g-dot { background:#A3A3A3; }
.glance .prose { font-size:12.5px; line-height:1.6; }

/* ── Açılış takvimi ── */
.sec-note { text-transform:none; letter-spacing:0; font-weight:500; }
.timeline { list-style:none; position:relative; padding:6px 0; }
.tl-row { display:grid; grid-template-columns:118px minmax(0,1fr); gap:12px; padding:8px 16px; position:relative; }
.tl-row::before { content:''; position:absolute; left:112px; top:0; bottom:0; width:2px; background:var(--border); }
.tl-row:first-child::before { top:50%; }
.tl-row:last-child::before { bottom:50%; }
.tl-row::after { content:''; position:absolute; left:107px; top:50%; width:12px; height:12px; margin-top:-6px;
  border-radius:50%; background:var(--surface); border:2px solid var(--border-2); }
.tl-row.moved::after { border-color:var(--accent); background:var(--accent); }
.tl-row.none::after { border-style:dashed; }
.tl-when { font-size:12px; font-weight:700; align-self:center; padding-right:14px; font-variant-numeric:tabular-nums; }
.tl-row.moved .tl-when { color:var(--accent); }
.tl-row.none .tl-when { color:var(--text-dim); font-weight:600; }
.tl-lines { display:flex; flex-wrap:wrap; gap:6px; padding-left:12px; }
.tl-line { display:inline-flex; align-items:center; gap:7px; padding:4px 10px 4px 4px; border:1px solid var(--border); border-radius:99px;
  font-size:12px; color:var(--text); background:var(--surface); max-width:100%; }
.tl-line:hover { border-color:var(--border-2); box-shadow:0 2px 8px rgba(0,0,0,.06); text-decoration:none; }
.tl-line span { min-width:0; }
.tl-was { font-size:10px; font-weight:600; color:var(--accent); background:#FEF2F2; padding:1px 6px; border-radius:4px; white-space:nowrap; }

/* Öne çıkanlar */
.hl { list-style:none; }
.hl li { display:flex; gap:12px; padding:14px 16px; }
.hl li + li { border-top:1px solid var(--border); }
.hl-icons { display:flex; flex-direction:column; gap:4px; padding-top:1px; }
.hl-body { min-width:0; display:flex; flex-direction:column; gap:4px; }
.hl h2 { font-size:13px; font-weight:700; line-height:1.35; }

/* Hat kartları (sitedeki .card) */
.cards { display:flex; flex-direction:column; gap:10px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px 13px 15px;
  display:flex; flex-direction:column; gap:10px; transition:box-shadow .15s, border-color .15s; }
.card:hover { box-shadow:0 2px 10px rgba(0,0,0,.08); border-color:var(--border-2); }
.card-top { display:flex; align-items:flex-start; gap:10px; }
.card-info { flex:1; min-width:0; }
.card-name { font-size:13px; font-weight:700; line-height:1.3; margin-bottom:5px; word-break:break-word; }
.card-name a { color:var(--text); }
.card-meta { display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
.card-chip { font-size:10px; color:var(--text-muted); }
.map-link { font-size:11px; font-weight:600; white-space:nowrap; padding-top:2px; }
.st-insaat { background:#EFF6FF; color:#1E40AF; }
.st-bekle  { background:#F5F5F5; color:#525252; }
.st-test   { background:#FFFBEB; color:#92400E; }
.card-bottom { display:flex; align-items:flex-start; gap:14px; }
.prog-col { flex:1; min-width:0; }
.field-lbl { font-size:9px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.prog-row { display:flex; align-items:center; gap:8px; }
.bar { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; }
.pct { font-size:13px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
.pct small { font-size:10px; font-weight:500; color:var(--text-dim); }
.date-col { flex-shrink:0; text-align:right; }
.date-val { font-size:13px; font-weight:600; line-height:1.2; display:flex; align-items:center; gap:5px; justify-content:flex-end; flex-wrap:wrap; }
.date-was { font-size:10px; color:var(--text-dim); margin-top:3px; }
.card-text { border-top:1px solid var(--border); padding-top:10px; }

/* Yöntem notu (sitedeki .modal-body) */
.method { padding:14px 16px; display:flex; flex-direction:column; gap:8px; font-size:12px; line-height:1.7; color:var(--text-muted); }
.method strong { color:var(--text); }

/* Arşiv listesi */
.issue { display:flex; align-items:center; gap:12px; padding:14px 16px; color:var(--text); }
.issue + .issue { border-top:1px solid var(--border); }
.issue:hover { background:var(--surface-2); text-decoration:none; }
.issue-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.issue-title { font-size:13px; font-weight:700; line-height:1.35; }
.issue-arrow { color:var(--text-dim); font-size:16px; }

@media (max-width:768px) {
  #header { padding:0 12px; }
  #logo-tagline { display:none; }
  .hdr-btn { height:40px; width:40px; padding:0; justify-content:center; gap:0; border-radius:50%; }
  .hdr-btn span { display:none; }
  .hdr-btn svg { width:18px; height:18px; }
  main { padding-top:calc(var(--header-h) + 14px); gap:16px; }
  .intro { padding:16px; }
  .hero { grid-template-columns:1fr; }
  .hero-main { padding:16px; }
  .hero h1 { font-size:21px; }
  .dek { font-size:13.5px; }
  .countdown { border-left:none; border-top:1px solid var(--border); flex-direction:row; align-items:center; padding:12px 16px; }
  .cd-head { flex-direction:column; align-items:flex-start; gap:6px; max-width:110px; }
  .cd-num b { font-size:44px; }
  .cd-foot { max-width:96px; text-align:right; }
  .glances { grid-template-columns:1fr; }
  .tl-row { grid-template-columns:minmax(0,1fr); padding:7px 12px 7px 38px; gap:6px; }
  .tl-row::before { left:21px; }
  .tl-row:first-child::before { top:18px; }
  .tl-row:last-child::before { bottom:auto; height:18px; }
  .tl-row::after { left:16px; top:18px; }
  .tl-when { font-size:11.5px; padding-right:0; align-self:start; line-height:22px; }
  .tl-lines { padding-left:0; }
  h1 { font-size:18px; }
  .metric-val { font-size:13px; }
  .card-bottom { flex-wrap:wrap; }
  .prog-col { flex-basis:100%; }
  .date-col { text-align:left; }
  .date-val { justify-content:flex-start; }
}
</style>
</head>
<body>

<header id="header">
  <a id="logo-link" href="/" aria-label="metrometre ana sayfa">
    <img id="logo-img" src="/metrometre_logotype.png" alt="metrometre"
      onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block'">
    <div id="logo-fallback"><span>metro</span>metre</div>
    <span id="logo-tagline">raylı sistem projeleri<br>takip paneli</span>
  </a>
  <nav id="header-actions" aria-label="Sayfa bağlantıları">
    
    <a class="hdr-btn primary" href="/" aria-label="Haritaya dön" title="Haritaya dön"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Haritaya dön</span></a>
  </nav>
</header>
<main>
<section class="panel"><div class="intro">
    <div class="eyebrow"><span class="tag tag-accent">Aylık bülten</span></div>
    <h1>Bültenler</h1>
    <p class="prose">İstanbul ve çevresinde yapımı süren raylı sistem hatlarında her ay öne çıkan gelişmeler.</p>
  </div></section>
<section aria-label="Sayılar">
  <div class="sec-lbl">Sayılar</div>
  <div class="panel">
    <a class="issue" href="/bulten/2026-09">
      <div class="issue-body"><span class="card-chip">Eylül 2026</span><span class="issue-title">M12 için geri sayım başladı, güney aksı bir çeyrek kaydı</span></div>
      <span class="issue-arrow" aria-hidden="true">›</span>
    </a>
  </div>
</section>
<section class="panel method"><p>Yeni bültenler için <a href="/feed.xml">RSS beslemesi</a>.</p></section>
</main>
</body>
</html>
